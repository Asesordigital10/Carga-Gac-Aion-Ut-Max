<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASYS AUTO - Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, setDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURACIÓN DE FIREBASE (JUAN)
        const firebaseConfig = {
            apiKey: "AIzaSyBlrsjN8s3iN0NRiuemEowIIwVqtkkWlOo",
            authDomain: "control-carga-aion-ut.firebaseapp.com",
            projectId: "control-carga-aion-ut",
            storageBucket: "control-carga-aion-ut.firebasestorage.app",
            messagingSenderId: "77118717320",
            appId: "1:77118717320:web:93ee651259cc7866438e3d"
        };

        // --- TABLA DE PRECIOS MAYO 2026 ---
        const COMBUSTIBLES = {
            "Super 95": { precio: 88.03, id: "super" },
            "Premium 97": { precio: 90.09, id: "premium" },
            "Gasoil 10S": { precio: 66.27, id: "g10s" },
            "Gasoil 50S": { precio: 57.72, id: "g50s" }
        };

        const PRECIO_KWH_BASE = 4.76;
        const PRECIO_CONEXION_BASE = 100;
        const IVA = 1.22;
        const RENDIMIENTO_ANTERIOR_KML = 12;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "control-carga-aion-ut";

        let user = null;
        let historialCargas = [];
        let estadoAuto = { 
            ultimoLavado: Date.now(), 
            por: "Sistema",
            combustibleComparativo: "Super 95"
        };
        let conductorSeleccionado = "Juan";

        signInAnonymously(auth);
        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'cargas'), orderBy('fecha', 'desc')), (snap) => {
                    historialCargas = snap.docs.map(d => d.data());
                    renderizarApp();
                });
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'estado', 'general'), (snap) => {
                    if (snap.exists()) {
                        estadoAuto = { ...estadoAuto, ...snap.data() };
                        renderizarApp();
                    }
                });
            }
        });

        // CAMBIAR COMBUSTIBLE DE COMPARACIÓN
        window.seleccionarCombustible = async (tipo) => {
            try {
                const estadoRef = doc(db, 'artifacts', appId, 'public', 'data', 'estado', 'general');
                await setDoc(estadoRef, { ...estadoAuto, combustibleComparativo: tipo }, { merge: true });
            } catch (e) { console.error(e); }
        };

        window.exportarReporte = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const kmActual = historialCargas[0]?.km || 0;
            const ahorroTotal = historialCargas.reduce((acc, curr) => acc + (curr.ahorro || 0), 0);
            const precioRef = COMBUSTIBLES[estadoAuto.combustibleComparativo].precio;

            doc.setFontSize(22);
            doc.setTextColor(0, 102, 204);
            doc.text("ASYS AUTO - REPORTE DE EFICIENCIA", 20, 20);
            doc.setFontSize(10);
            doc.setTextColor(100);
            doc.text(`Vehículo: GAC Aion MAX | Emitido: ${new Date().toLocaleDateString()}`, 20, 28);
            doc.line(20, 32, 190, 32);

            doc.setFontSize(14);
            doc.setTextColor(0);
            doc.text("ANÁLISIS DE AHORRO", 20, 45);
            doc.setFontSize(11);
            doc.text(`Kilometraje Total: ${kmActual.toLocaleString()} km`, 20, 55);
            doc.text(`Combustible de Referencia: ${estadoAuto.combustibleComparativo} ($${precioRef})`, 20, 62);
            doc.text(`Ahorro Neto Acumulado: $ ${ahorroTotal.toLocaleString('es-UY')}`, 20, 69);
            
            doc.text("ÚLTIMOS REGISTROS", 20, 85);
            let y = 95;
            historialCargas.slice(0, 15).forEach((c) => {
                doc.text(`${new Date(c.fecha).toLocaleDateString()} - ${c.km}km - Costo carga: $${c.costo.toFixed(0)}`, 20, y);
                y += 7;
            });

            doc.save(`Reporte_AsysAuto_${kmActual}km.pdf`);
        };

        window.abrirMapaCarga = () => window.open("https://www.google.com/maps/search/cargador+auto+electrico", "_blank");
        window.abrirUteMueve = () => window.open("https://movilidad.ute.com.uy/carga.html", "_blank");

        window.guardarLavadoManual = async () => {
            const fechaInput = document.getElementById('fecha-lavado').value;
            if (!fechaInput) return alert("Selecciona fecha");
            const [year, month, day] = fechaInput.split('-');
            const timestamp = new Date(year, month - 1, day, 12, 0, 0).getTime();
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'estado', 'general'), { ...estadoAuto, ultimoLavado: timestamp, por: conductorSeleccionado }, { merge: true });
        };

        document.getElementById('carga-form').onsubmit = async (e) => {
            e.preventDefault();
            const km = parseFloat(document.getElementById('km').value);
            const kwh = parseFloat(document.getElementById('kwh').value);
            const esCien = document.getElementById('es-cien').checked;
            const costo = (kwh * PRECIO_KWH_BASE * IVA) + (PRECIO_CONEXION_BASE * IVA);
            let ahorro = 0;
            
            const precioReferencia = COMBUSTIBLES[estadoAuto.combustibleComparativo].precio;

            if (historialCargas.length > 0) {
                const dist = km - historialCargas[0].km;
                if (dist > 0) {
                    const costoAnterior = (dist / RENDIMIENTO_ANTERIOR_KML) * precioReferencia;
                    ahorro = costoAnterior - costo;
                }
            }
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'cargas'), { fecha: Date.now(), km, kwh, conductor: conductorSeleccionado, esCien, costo, ahorro });
            e.target.reset();
            alert("Registro completado");
        };

        function renderizarApp() {
            const kmActual = historialCargas[0]?.km || 0;
            const proximoService = Math.ceil((kmActual + 1) / 10000) * 10000;
            const faltan = proximoService - kmActual;

            // SERVICE CARD
            document.getElementById('card-mantenimiento').innerHTML = `
                <div class="bg-zinc-900 border ${faltan < 500 ? 'border-orange-500 ring-2 ring-orange-500/20' : 'border-zinc-800'} p-5 rounded-[2rem] shadow-2xl">
                    <p class="text-zinc-500 text-[10px] uppercase font-black tracking-widest mb-1">Status Mantenimiento</p>
                    <p class="text-2xl font-black ${faltan < 500 ? 'text-orange-500' : 'text-zinc-100'}">Faltan ${faltan.toLocaleString()} km</p>
                    <p class="text-[9px] text-zinc-600 mt-1 uppercase">Próximo Service: ${proximoService.toLocaleString()} KM</p>
                </div>`;

            // AHORRO & SELECTOR CARD
            const ahorroTotal = historialCargas.reduce((acc, curr) => acc + (curr.ahorro || 0), 0);
            document.getElementById('card-ahorro').innerHTML = `
                <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-[2rem] shadow-2xl">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <p class="text-zinc-500 text-[10px] uppercase font-black tracking-widest mb-1">Ahorro Real</p>
                            <p class="text-4xl font-black text-green-500">$ ${ahorroTotal.toLocaleString('es-UY', {maximumFractionDigits:0})}</p>
                        </div>
                        <div class="p-3 bg-green-500/10 rounded-2xl text-green-500"><i data-lucide="trending-up"></i></div>
                    </div>
                    
                    <div class="space-y-3">
                        <p class="text-[10px] text-zinc-600 uppercase font-black tracking-widest text-center">Comparado contra su antiguo vehículo:</p>
                        <div class="grid grid-cols-2 gap-2">
                            ${Object.keys(COMBUSTIBLES).map(tipo => `
                                <button onclick="seleccionarCombustible('${tipo}')" 
                                    class="p-2 rounded-xl border text-[10px] font-bold transition-all ${estadoAuto.combustibleComparativo === tipo ? 'bg-blue-600 border-blue-500 text-white' : 'bg-zinc-800 border-zinc-700 text-zinc-500'}">
                                    ${tipo}<br><span class="opacity-70">$${COMBUSTIBLES[tipo].precio}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>`;

            // LAVADO CARD
            const hoy = new Date().setHours(0,0,0,0);
            const dLavado = new Date(estadoAuto.ultimoLavado).setHours(0,0,0,0);
            const dias = Math.floor(Math.abs(hoy - dLavado) / 86400000);
            document.getElementById('card-lavado').innerHTML = `
                <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-[2rem] shadow-2xl">
                    <p class="text-sm font-bold text-zinc-100 mb-4">El último lavado fue hace <span class="text-blue-500">${dias} días</span>.</p>
                    <div class="flex gap-2">
                        <input type="date" id="fecha-lavado" class="flex-grow bg-black border border-zinc-800 text-zinc-400 p-3 rounded-xl text-xs outline-none">
                        <button onclick="guardarLavadoManual()" class="bg-blue-600 text-white px-4 rounded-xl shadow-lg active:scale-95"><i data-lucide="check"></i></button>
                    </div>
                </div>`;

            lucide.createIcons();
        }

        window.onload = () => {
            const chips = document.querySelectorAll('.driver-chip');
            chips.forEach(c => c.onclick = () => {
                chips.forEach(x => { x.classList.remove('bg-blue-600', 'text-white'); x.classList.add('bg-zinc-800', 'text-zinc-400'); });
                c.classList.remove('bg-zinc-800', 'text-zinc-400');
                c.classList.add('bg-blue-600', 'text-white');
                conductorSeleccionado = c.dataset.name;
            });
            initApp();
        };
    </script>
</head>
<body class="p-6 max-w-md mx-auto bg-black text-zinc-100 min-h-screen pb-20 font-sans">
    
    <header class="mb-10 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black italic tracking-tighter uppercase leading-none">ASYS<span class="text-blue-500 font-normal">AUTO</span></h1>
            <p class="text-[9px] text-zinc-700 uppercase font-bold tracking-[0.4em] mt-2 font-mono">Expert Management Suite</p>
        </div>
        <button onclick="exportarReporte()" class="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 text-blue-500 active:scale-90 transition-all shadow-xl"><i data-lucide="file-text"></i></button>
    </header>

    <!-- ACCESO RÁPIDO OPERATIVO -->
    <section class="bg-zinc-900/40 p-8 rounded-[3rem] border border-zinc-800/40 shadow-2xl mb-8">
        <form id="carga-form" class="space-y-6">
            <div class="grid grid-cols-3 gap-2">
                <div data-name="Juan" class="driver-chip p-3 rounded-2xl border border-blue-500 text-center font-bold text-xs bg-blue-600 text-white cursor-pointer transition-all">Juan</div>
                <div data-name="Tania" class="driver-chip p-3 rounded-2xl border border-zinc-700 text-center font-bold text-xs bg-zinc-800 text-zinc-400 cursor-pointer transition-all">Tania</div>
                <div data-name="Mauri" class="driver-chip p-3 rounded-2xl border border-zinc-700 text-center font-bold text-xs bg-zinc-800 text-zinc-400 cursor-pointer transition-all">Mauri</div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <input type="number" id="km" required class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-center font-black text-xl outline-none" placeholder="Km">
                <input type="number" step="0.1" id="kwh" required class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-center font-black text-xl outline-none" placeholder="kWh">
            </div>
            <button type="submit" class="w-full bg-blue-600 p-5 rounded-[2.5rem] font-black tracking-[0.2em] text-sm shadow-xl active:scale-95 transition-all">REGISTRAR CARGA</button>
        </form>
    </section>

    <!-- NAVEGACIÓN -->
    <section class="mb-8 grid grid-cols-2 gap-4">
        <button onclick="abrirMapaCarga()" class="bg-zinc-900 border border-zinc-800 p-4 rounded-3xl flex flex-col items-center gap-2 active:scale-95 transition-all">
            <div class="p-3 bg-red-500/10 rounded-2xl text-red-500"><i data-lucide="map"></i></div>
            <p class="text-[9px] font-black uppercase text-zinc-500">Cargadores</p>
        </button>
        <button onclick="abrirUteMueve()" class="bg-zinc-900 border border-zinc-800 p-4 rounded-3xl flex flex-col items-center gap-2 active:scale-95 transition-all">
            <div class="p-3 bg-blue-500/10 rounded-2xl text-blue-500"><i data-lucide="navigation"></i></div>
            <p class="text-[9px] font-black uppercase text-zinc-500">UTE Mueve</p>
        </button>
    </section>

    <!-- PANEL DE CONTROL (DASHBOARD) -->
    <div id="card-mantenimiento" class="mb-4"></div>
    <div id="card-ahorro" class="mb-4"></div>
    <div id="card-lavado" class="mb-12"></div>

    <footer class="text-center opacity-20 py-10">
        <p class="text-[8px] font-black uppercase tracking-[0.6em]">Montevideo - Uruguay 2026</p>
    </footer>

    <script>lucide.createIcons();</script>
</body>
</html>
