<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASYS AUTO - Gestión Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, setDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlrsjN8s3iN0NRiuemEowIIwVqtkkWlOo",
            authDomain: "control-carga-aion-ut.firebaseapp.com",
            projectId: "control-carga-aion-ut",
            storageBucket: "control-carga-aion-ut.firebasestorage.app",
            messagingSenderId: "77118717320",
            appId: "1:77118717320:web:93ee651259cc7866438e3d"
        };

        // --- CONSTANTES ACTUALIZADAS AL 1º DE MAYO ---
        const PRECIO_KWH_BASE = 4.76;
        const PRECIO_CONEXION_BASE = 100;
        const IVA = 1.22;
        const PRECIO_NAFTA_L = 88.03; // Actualizado de 82.27 a 88.03
        const RENDIMIENTO_VERSA_KML = 12;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "control-carga-aion-ut";

        let user = null;
        let historialCargas = [];
        let estadoAuto = { ultimoLavado: Date.now(), por: "Sistema" };
        let conductorSeleccionado = "Juan";

        signInAnonymously(auth);
        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'cargas'), orderBy('fecha', 'desc')), (snap) => {
                    historialCargas = snap.docs.map(d => d.data());
                    renderizarApp();
                });
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'estado', 'general'), (snap) => {
                    if (snap.exists()) {
                        estadoAuto = snap.data();
                        renderizarApp();
                    }
                });
            }
        });

        window.exportarReporte = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const kmActual = historialCargas[0]?.km || 0;
            const ahorroTotal = historialCargas.reduce((acc, curr) => acc + (curr.ahorro || 0), 0);

            doc.setFontSize(22);
            doc.text("ASYS AUTO - REPORTE DE GESTIÓN", 20, 20);
            doc.setFontSize(10);
            doc.text(`Vehículo: GAC Aion MAX | Fecha: ${new Date().toLocaleDateString()}`, 20, 28);
            doc.line(20, 32, 190, 32);

            doc.setFontSize(14);
            doc.text("RESUMEN OPERATIVO", 20, 45);
            doc.setFontSize(11);
            doc.text(`Kilometraje: ${kmActual.toLocaleString()} km`, 20, 55);
            doc.text(`Ahorro Total (vs Nafta @ $88.03): $ ${ahorroTotal.toLocaleString()}`, 20, 62);
            doc.text(`Estado del Lavado: Hace ${Math.floor((Date.now() - estadoAuto.ultimoLavado) / 86400000)} días`, 20, 69);

            doc.text("BITÁCORA RECIENTE", 20, 85);
            let y = 95;
            historialCargas.slice(0, 12).forEach((c) => {
                doc.text(`${new Date(c.fecha).toLocaleDateString()} - ${c.km}km - ${c.kwh}kWh ($${c.costo.toFixed(0)})`, 20, y);
                y += 7;
            });

            doc.save(`Reporte_Movilidad_${new Date().toLocaleDateString()}.pdf`);
        };

        window.guardarLavadoManual = async () => {
            const fechaInput = document.getElementById('fecha-lavado').value;
            if (!fechaInput) return alert("Selecciona la fecha primero");
            const [year, month, day] = fechaInput.split('-');
            const timestamp = new Date(year, month - 1, day, 12, 0, 0).getTime();
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'estado', 'general'), { ultimoLavado: timestamp, por: conductorSeleccionado });
        };

        document.getElementById('carga-form').onsubmit = async (e) => {
            e.preventDefault();
            const km = parseFloat(document.getElementById('km').value);
            const kwh = parseFloat(document.getElementById('kwh').value);
            const esCien = document.getElementById('es-cien').checked;
            const costo = (kwh * PRECIO_KWH_BASE * IVA) + (PRECIO_CONEXION_BASE * IVA);
            let ahorro = 0;
            if (historialCargas.length > 0) {
                const dist = km - historialCargas[0].km;
                if (dist > 0) ahorro = ((dist / RENDIMIENTO_VERSA_KML) * PRECIO_NAFTA_L) - costo;
            }
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'cargas'), { fecha: Date.now(), km, kwh, conductor: conductorSeleccionado, esCien, costo, ahorro });
            e.target.reset();
        };

        function renderizarApp() {
            const kmActual = historialCargas[0]?.km || 0;
            const proximoService = Math.ceil((kmActual + 1) / 10000) * 10000;
            const faltan = proximoService - kmActual;
            const progreso = ((10000 - (faltan > 10000 ? 10000 : faltan)) / 10000) * 100;

            document.getElementById('card-mantenimiento').innerHTML = `
                <div class="bg-zinc-900 border ${faltan < 500 ? 'border-orange-500' : 'border-zinc-800'} p-5 rounded-[2rem]">
                    <p class="text-zinc-500 text-[10px] uppercase font-bold tracking-widest mb-1 font-mono">Mantenimiento Oficial</p>
                    <p class="text-2xl font-black ${faltan < 500 ? 'text-orange-500' : 'text-zinc-100'}">Faltan ${faltan.toLocaleString()} km</p>
                    <div class="mt-4 w-full bg-zinc-800 h-1 rounded-full overflow-hidden">
                        <div class="h-full bg-blue-600 transition-all duration-1000" style="width: ${progreso}%"></div>
                    </div>
                </div>`;

            const ahorroTotal = historialCargas.reduce((acc, curr) => acc + (curr.ahorro || 0), 0);
            document.getElementById('card-ahorro').innerHTML = `
                <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-[2rem] flex items-center justify-between">
                    <div>
                        <p class="text-zinc-500 text-[10px] uppercase font-bold tracking-widest mb-1 font-mono text-center">Ahorro Real vs Nafta</p>
                        <p class="text-3xl font-black text-green-500">$ ${ahorroTotal.toLocaleString('es-UY', {maximumFractionDigits:0})}</p>
                    </div>
                    <div class="p-3 bg-green-500/10 rounded-2xl text-green-500"><i data-lucide="trending-up"></i></div>
                </div>`;

            const hoy = new Date().setHours(0,0,0,0);
            const dLavado = new Date(estadoAuto.ultimoLavado).setHours(0,0,0,0);
            const dias = Math.floor(Math.abs(hoy - dLavado) / 86400000);
            document.getElementById('card-lavado').innerHTML = `
                <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-[2rem]">
                    <p class="text-sm font-bold text-zinc-100 mb-3 font-center italic">El último lavado fue hace <span class="${dias > 7 ? 'text-orange-500' : 'text-blue-500'}">${dias} días</span>.</p>
                    <div class="flex gap-2">
                        <input type="date" id="fecha-lavado" class="flex-grow bg-black border border-zinc-800 text-zinc-400 p-3 rounded-xl text-xs outline-none focus:border-blue-500">
                        <button onclick="guardarLavadoManual()" class="bg-blue-600 text-white px-5 rounded-xl active:scale-95 transition-all"><i data-lucide="check"></i></button>
                    </div>
                </div>`;

            const lista = document.getElementById('lista-cargas');
            lista.innerHTML = historialCargas.slice(0, 5).map(c => `
                <div class="bg-zinc-900/50 p-4 rounded-2xl border border-zinc-800/40 mb-3 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-[10px] font-bold text-blue-500 border border-zinc-700">${c.conductor.charAt(0)}</div>
                        <div>
                            <p class="text-sm font-bold text-zinc-200">${c.km.toLocaleString()} km</p>
                            <p class="text-[9px] text-zinc-600 font-mono">${new Date(c.fecha).toLocaleDateString()}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-bold text-green-600">$${c.costo.toFixed(0)}</p>
                        <p class="text-[9px] text-zinc-500 font-mono">${c.kwh} kWh</p>
                    </div>
                </div>`).join('');
            lucide.createIcons();
        }

        window.onload = () => {
            const chips = document.querySelectorAll('.driver-chip');
            chips.forEach(c => c.onclick = () => {
                chips.forEach(x => { x.classList.remove('bg-blue-600', 'text-white'); x.classList.add('bg-zinc-800', 'text-zinc-400'); });
                c.classList.remove('bg-zinc-800', 'text-zinc-400');
                c.classList.add('bg-blue-600', 'text-white');
                conductorSeleccionado = c.dataset.name;
            });
            initApp();
        };
    </script>
</head>
<body class="p-6 max-w-md mx-auto bg-black text-zinc-100 min-h-screen pb-20">
    
    <header class="mb-10 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black italic tracking-tighter uppercase leading-none">ASYS<span class="text-blue-500 font-normal">AUTO</span></h1>
            <p class="text-[10px] text-zinc-700 uppercase font-bold tracking-[0.4em] mt-2 font-mono">Powered by Asesor Digital UY</p>
        </div>
        <button onclick="exportarReporte()" class="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 text-blue-500 active:scale-90 transition-all"><i data-lucide="file-down"></i></button>
    </header>

    <section class="bg-zinc-900/60 p-8 rounded-[3rem] border border-zinc-800/40 shadow-2xl mb-10 relative overflow-hidden">
        <h2 class="text-[10px] font-black text-zinc-500 uppercase tracking-[0.4em] mb-8 text-center font-mono">Registrar Actividad</h2>
        <form id="carga-form" class="space-y-8">
            <div class="grid grid-cols-3 gap-2">
                <div data-name="Juan" class="driver-chip p-3 rounded-2xl border border-blue-500 text-center font-bold text-xs bg-blue-600 text-white cursor-pointer transition-all">Juan</div>
                <div data-name="Tania" class="driver-chip p-3 rounded-2xl border border-zinc-800 text-center font-bold text-xs bg-zinc-800 text-zinc-400 cursor-pointer transition-all">Tania</div>
                <div data-name="Mauri" class="driver-chip p-3 rounded-2xl border border-zinc-800 text-center font-bold text-xs bg-zinc-800 text-zinc-400 cursor-pointer transition-all">Mauri</div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <input type="number" id="km" required class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-center font-black text-xl outline-none" placeholder="Km">
                <input type="number" step="0.1" id="kwh" required class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-center font-black text-xl outline-none" placeholder="kWh">
            </div>
            <button type="submit" class="w-full bg-blue-600 p-5 rounded-[2rem] font-black tracking-[0.2em] text-sm shadow-xl active:scale-95 transition-all">GUARDAR REGISTRO</button>
        </form>
    </section>

    <div id="card-mantenimiento" class="mb-4"></div>
    <div id="card-ahorro" class="mb-4"></div>
    <div id="card-lavado" class="mb-12"></div>

    <div class="px-2">
        <h3 class="text-[10px] font-black text-zinc-800 uppercase mb-6 tracking-[0.4em] flex items-center gap-3">
            <span class="w-8 h-[1px] bg-zinc-900"></span> Bitácora de Movimientos
        </h3>
        <div id="lista-cargas"></div>
    </div>
</body>
</html>
