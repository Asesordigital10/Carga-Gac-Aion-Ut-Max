<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASYS AUTO</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="logoasys.png">
    <link rel="apple-touch-icon" href="logoasys.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, setDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlrsjN8s3iN0NRiuemEowIIwVqtkkWlOo",
            authDomain: "control-carga-aion-ut.firebaseapp.com",
            projectId: "control-carga-aion-ut",
            storageBucket: "control-carga-aion-ut.firebasestorage.app",
            messagingSenderId: "77118717320",
            appId: "1:77118717320:web:93ee651259cc7866438e3d"
        };

        const COMBUSTIBLES = {
            "Super 95": { precio: 88.03 },
            "Premium 97": { precio: 90.09 },
            "Gasoil 10S": { precio: 66.27 },
            "Gasoil 50S": { precio: 57.72 }
        };

        const PRECIO_KWH_BASE = 4.76;
        const PRECIO_CONEXION_BASE = 100;
        const IVA = 1.22;
        const RENDIMIENTO_ANTERIOR_KML = 12;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "control-carga-aion-ut";

        let user = null;
        let historialCargas = [];
        let estadoAuto = { ultimoLavado: Date.now(), por: "Sistema", combustibleComparativo: "Super 95" };
        let conductorSeleccionado = "Juan";

        if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.warn('PWA Mode Disabled'));
            });
        }

        const initAuth = async () => {
            try { await signInAnonymously(auth); } catch (e) { console.error(e); }
        };
        initAuth();

        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'cargas'), orderBy('fecha', 'desc')), (snap) => {
                    historialCargas = snap.docs.map(d => d.data());
                    renderizarApp();
                });
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'estado', 'general'), (snap) => {
                    if (snap.exists()) {
                        estadoAuto = { ...estadoAuto, ...snap.data() };
                        renderizarApp();
                    }
                });
            }
        });

        // Función que calcula el costo mientras el usuario escribe
        window.actualizarPreviewCosto = () => {
            const llegada = parseFloat(document.getElementById('kwh-llegada').value) || 0;
            const salida = parseFloat(document.getElementById('kwh-salida').value) || 0;
            const kwhCargados = Math.max(0, salida - llegada);
            const costo = (kwhCargados * PRECIO_KWH_BASE * IVA) + (PRECIO_CONEXION_BASE * IVA);
            
            const previewEl = document.getElementById('preview-costo');
            if (kwhCargados > 0) {
                previewEl.innerText = `Llenado: ${kwhCargados.toFixed(1)} kWh | Costo: $${costo.toFixed(0)}`;
                previewEl.className = "text-center text-[11px] font-black text-blue-400 uppercase tracking-widest bg-blue-400/10 py-3 rounded-2xl border border-blue-400/20 transition-all";
            } else {
                previewEl.innerText = "Esperando telemetría de energía...";
                previewEl.className = "text-center text-[10px] font-bold text-zinc-600 uppercase tracking-widest bg-zinc-900/50 py-3 rounded-2xl border border-zinc-800/50";
            }
        };

        window.seleccionarCombustible = async (tipo) => {
            const estadoRef = doc(db, 'artifacts', appId, 'public', 'data', 'estado', 'general');
            await setDoc(estadoRef, { ...estadoAuto, combustibleComparativo: tipo }, { merge: true });
        };

        window.abrirMapaCarga = () => window.open("https://www.google.com/maps/search/cargador+auto+electrico+uruguay", "_blank");
        window.abrirUteMueve = () => window.open("https://ute.com.uy/movilidad-electrica", "_blank");

        window.exportarReporte = () => {
            const { jsPDF } = window.jspdf;
            const docPdf = new jsPDF();
            const kmActual = historialCargas[0]?.km || 0;
            const ahorroTotal = historialCargas.reduce((acc, curr) => acc + (curr.ahorro || 0), 0);
            docPdf.text("ASYS AUTO - REPORTE", 20, 20);
            docPdf.text(`Km: ${kmActual} | Ahorro: $${ahorroTotal.toLocaleString()}`, 20, 35);
            docPdf.save(`Reporte_AsysAuto.pdf`);
        };

        window.guardarLavadoManual = async () => {
            const fechaInput = document.getElementById('fecha-lavado').value;
            if (!fechaInput) return;
            const [year, month, day] = fechaInput.split('-');
            const timestamp = new Date(year, month - 1, day, 12, 0, 0).getTime();
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'estado', 'general'), { ...estadoAuto, ultimoLavado: timestamp, por: conductorSeleccionado }, { merge: true });
        };

        document.getElementById('carga-form').onsubmit = async (e) => {
            e.preventDefault();
            const km = parseFloat(document.getElementById('km').value);
            const kwhLlegada = parseFloat(document.getElementById('kwh-llegada').value);
            const kwhSalida = parseFloat(document.getElementById('kwh-salida').value);
            const esCien = document.getElementById('es-cien').checked;
            
            const kwhTotales = kwhSalida - kwhLlegada;
            if (kwhTotales <= 0) return alert("Error: Los kWh de salida deben ser mayores a los de llegada.");

            const costo = (kwhTotales * PRECIO_KWH_BASE * IVA) + (PRECIO_CONEXION_BASE * IVA);
            let ahorro = 0;
            const precioRef = COMBUSTIBLES[estadoAuto.combustibleComparativo].precio;

            if (historialCargas.length > 0) {
                const dist = km - historialCargas[0].km;
                if (dist > 0) ahorro = ((dist / RENDIMIENTO_ANTERIOR_KML) * precioRef) - costo;
            }
            
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'cargas'), { 
                fecha: Date.now(), km, kwhLlegada, kwhSalida, kwhTotales, 
                conductor: conductorSeleccionado, esCien, costo, ahorro 
            });
            
            e.target.reset();
            actualizarPreviewCosto();
        };

        function renderizarApp() {
            const kmActual = historialCargas[0]?.km || 0;
            const proximoService = Math.ceil((kmActual + 1) / 10000) * 10000;
            const faltan = proximoService - kmActual;
            const progreso = ((10000 - (faltan > 10000 ? 10000 : faltan)) / 10000) * 100;

            document.getElementById('card-mantenimiento').innerHTML = `
                <div class="bg-zinc-900 border ${faltan < 500 ? 'border-orange-500' : 'border-zinc-800'} p-5 rounded-3xl">
                    <p class="text-zinc-500 text-[10px] uppercase font-bold tracking-widest mb-1">Mantenimiento Oficial</p>
                    <p class="text-2xl font-black ${faltan < 500 ? 'text-orange-500' : 'text-zinc-100'}">Faltan ${faltan.toLocaleString()} km</p>
                    <div class="mt-4 w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden"><div class="h-full bg-blue-600" style="width: ${progreso}%"></div></div>
                </div>`;

            const ahorroTotal = historialCargas.reduce((acc, curr) => acc + (curr.ahorro || 0), 0);
            document.getElementById('card-ahorro').innerHTML = `
                <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-3xl shadow-xl">
                    <p class="text-zinc-500 text-[10px] uppercase font-bold mb-1 tracking-widest">Ahorro Real Acumulado</p>
                    <p class="text-4xl font-black text-green-500 mb-6 font-mono">$ ${ahorroTotal.toLocaleString('es-UY', {maximumFractionDigits:0})}</p>
                    <div class="grid grid-cols-2 gap-2">
                        ${Object.keys(COMBUSTIBLES).map(t => `<button onclick="seleccionarCombustible('${t}')" class="p-2 rounded-xl border text-[9px] font-bold ${estadoAuto.combustibleComparativo === t ? 'bg-blue-600 border-blue-500 text-white' : 'bg-zinc-800 border-zinc-700 text-zinc-500'}">${t}</button>`).join('')}
                    </div>
                </div>`;

            const hoy = new Date().setHours(0,0,0,0);
            const dias = Math.floor(Math.abs(hoy - new Date(estadoAuto.ultimoLavado).setHours(0,0,0,0)) / 86400000);
            document.getElementById('card-lavado').innerHTML = `
                <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-3xl">
                    <p class="text-sm font-bold text-zinc-100 mb-4">Último lavado: <span class="text-blue-500">${dias} días</span>.</p>
                    <div class="flex gap-2"><input type="date" id="fecha-lavado" class="flex-grow bg-black border border-zinc-800 text-zinc-400 p-3 rounded-xl text-xs outline-none"><button onclick="guardarLavadoManual()" class="bg-blue-600 text-white px-4 rounded-xl active:scale-90"><i data-lucide="check"></i></button></div>
                </div>`;

            const lista = document.getElementById('lista-cargas');
            lista.innerHTML = historialCargas.slice(0, 5).map(c => `
                <div class="bg-zinc-900/40 p-4 rounded-2xl border border-zinc-800/40 mb-2 flex justify-between items-center text-xs">
                    <div><span class="font-bold text-blue-500">${c.conductor}</span><br>${c.km.toLocaleString()} km</div>
                    <div class="text-right"><span class="text-green-500 font-bold">$${c.costo.toFixed(0)}</span><br><span class="text-[9px] text-zinc-600">${c.kwhLlegada}→${c.kwhSalida}</span></div>
                </div>`).join('');
            lucide.createIcons();
        }

        window.onload = () => {
            const chips = document.querySelectorAll('.driver-chip');
            chips.forEach(c => c.onclick = () => {
                chips.forEach(x => { x.classList.remove('bg-blue-600', 'text-white'); x.classList.add('bg-zinc-800', 'text-zinc-400'); });
                c.classList.remove('bg-zinc-800', 'text-zinc-400');
                c.classList.add('bg-blue-600', 'text-white');
                conductorSeleccionado = c.dataset.name;
            });
            lucide.createIcons();
            renderizarApp();
        };
    </script>
    <style>
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        body { background-color: #000; font-family: ui-sans-serif, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-6 max-w-md mx-auto min-h-screen pb-24 text-zinc-100">
    
    <header class="mb-10 flex flex-col items-center gap-4">
        <div class="relative">
            <img src="logoasys.png" alt="Logo ASYS AUTO" class="w-32 h-32 object-contain filter drop-shadow-2xl">
            <div class="absolute -inset-2 bg-blue-600/10 blur-2xl rounded-full -z-10"></div>
        </div>
        <div class="text-center">
            <h1 class="text-3xl font-black italic tracking-tighter uppercase leading-none">ASYS<span class="text-blue-500 font-normal">AUTO</span></h1>
            <p class="text-[10px] text-zinc-700 uppercase font-bold tracking-[0.4em] mt-2 font-mono">Expert Management Suite</p>
        </div>
    </header>

    <!-- FORMULARIO OPERATIVO CON TELEMETRÍA DUAL -->
    <section class="bg-zinc-900/60 p-8 rounded-[3rem] border border-zinc-800/40 shadow-2xl mb-8">
        <form id="carga-form" class="space-y-6">
            <div class="grid grid-cols-3 gap-2">
                <div data-name="Juan" class="driver-chip p-3 rounded-2xl border border-blue-500 text-center font-bold text-xs bg-blue-600 text-white cursor-pointer transition-all">Juan</div>
                <div data-name="Tania" class="driver-chip p-3 rounded-2xl border border-zinc-800 text-center font-bold text-xs bg-zinc-800 text-zinc-400 cursor-pointer transition-all">Tania</div>
                <div data-name="Mauri" class="driver-chip p-3 rounded-2xl border border-zinc-800 text-center font-bold text-xs bg-zinc-800 text-zinc-400 cursor-pointer transition-all">Mauri</div>
            </div>
            
            <div class="space-y-5">
                <div class="space-y-1">
                    <label class="text-[9px] text-zinc-600 font-bold uppercase ml-2 tracking-widest font-mono">Kilómetros</label>
                    <input type="number" id="km" required class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-center font-black text-xl outline-none focus:border-blue-600 transition-all shadow-inner" placeholder="0">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[9px] text-zinc-600 font-bold uppercase ml-2 tracking-widest font-mono text-center block">kWh Llegada</label>
                        <input type="number" step="0.1" id="kwh-llegada" oninput="actualizarPreviewCosto()" required class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-center font-black text-xl outline-none focus:border-blue-500 transition-all text-orange-400" placeholder="0.0">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] text-zinc-600 font-bold uppercase ml-2 tracking-widest font-mono text-center block">kWh Salida</label>
                        <input type="number" step="0.1" id="kwh-salida" oninput="actualizarPreviewCosto()" required class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-center font-black text-xl outline-none focus:border-blue-500 transition-all text-green-400" placeholder="0.0">
                    </div>
                </div>
            </div>

            <!-- Etiqueta de Costo en Tiempo Real -->
            <div id="preview-costo" class="text-center text-[10px] font-bold text-zinc-600 uppercase tracking-widest bg-zinc-900/50 py-3 rounded-2xl border border-zinc-800/50">
                Esperando telemetría de energía...
            </div>

            <label class="flex items-center justify-between p-5 bg-black/40 border border-zinc-800/40 rounded-2xl cursor-pointer">
                <span class="text-xs font-bold text-zinc-400 uppercase tracking-tighter">Carga al 100%</span>
                <input type="checkbox" id="es-cien" class="w-6 h-6 rounded-lg accent-blue-600">
            </label>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 p-5 rounded-[2.5rem] font-black tracking-[0.2em] text-sm shadow-xl shadow-blue-900/30 active:scale-95 transition-all uppercase">Guardar Registro</button>
        </form>
    </section>

    <!-- NAVEGACIÓN -->
    <div class="mb-8 grid grid-cols-2 gap-4">
        <button onclick="abrirMapaCarga()" class="bg-zinc-900 border border-zinc-800 p-5 rounded-3xl flex flex-col items-center gap-2 active:scale-95 transition-all shadow-xl">
            <div class="p-2 bg-red-500/10 rounded-xl text-red-500"><i data-lucide="map-pin"></i></div>
            <p class="text-[9px] font-black uppercase text-zinc-500 tracking-tighter">Cargadores</p>
        </button>
        <button onclick="abrirUteMueve()" class="bg-zinc-900 border border-zinc-800 p-5 rounded-3xl flex flex-col items-center gap-2 active:scale-95 transition-all text-center shadow-xl">
            <div class="p-2 bg-blue-500/10 rounded-xl text-blue-500"><i data-lucide="zap"></i></div>
            <p class="text-[9px] font-black uppercase text-zinc-500 tracking-tighter">Red UTE</p>
        </button>
    </div>

    <!-- DASHBOARD -->
    <div id="card-mantenimiento" class="mb-4"></div>
    <div id="card-ahorro" class="mb-4"></div>
    <div id="card-lavado" class="mb-10"></div>

    <div class="flex justify-between items-center px-2 mb-6">
        <h3 class="text-[10px] font-black text-zinc-800 uppercase tracking-[0.5em]">Historial</h3>
        <button onclick="exportarReporte()" class="text-blue-500 text-[10px] font-black uppercase flex items-center gap-2 bg-blue-500/10 px-4 py-2 rounded-full border border-blue-500/20 active:scale-90 transition-all">
            <i data-lucide="file-down" class="w-3"></i> PDF
        </button>
    </div>
    <div id="lista-cargas" class="pb-10"></div>

</body>
</html>
