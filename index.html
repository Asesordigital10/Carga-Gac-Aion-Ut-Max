<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASYS AUTO - Control Profesional</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="logoasys.png">
    <link rel="apple-touch-icon" href="logoasys.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, setDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlrsjN8s3iN0NRiuemEowIIwVqtkkWlOo",
            authDomain: "control-carga-aion-ut.firebaseapp.com",
            projectId: "control-carga-aion-ut",
            storageBucket: "control-carga-aion-ut.firebasestorage.app",
            messagingSenderId: "77118717320",
            appId: "1:77118717320:web:93ee651259cc7866438e3d"
        };

        const RENDIMIENTO_ANTERIOR_KML = 12;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "control-carga-aion-ut";

        let user = null;
        let historialCargas = [];
        let estadoAuto = { 
            ultimoLavado: Date.now(), 
            combustibleComparativo: "Super 95",
            nombreUsuario: "Juan",
            modeloAuto: "Gac Aion Ut Max",
            matricula: "AAA1234",
            nombreTaller: "Service Oficial GAC",
            direccionTaller: "Av. Italia 1234, Montevideo",
            telefonoTaller: "099123456",
            precios: {
                empresa: 4.76,
                hogarValle: 2.32,
                uteLenta: 7.54,
                uteRapida: 10.80,
                wallboxEspecial: 12.00
            },
            combustibles: {
                "Super 95": 88.03,
                "Premium 97": 90.09,
                "Gasoil 10S": 66.27,
                "Gasoil 50S": 57.72
            }
        };

        // Service Worker v24
        if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js').then(reg => {
                    reg.onupdatefound = () => {
                        const installingWorker = reg.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                window.location.reload();
                            }
                        };
                    };
                });
            });
        }

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (e) {
                        await signInAnonymously(auth);
                    }
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                await signInAnonymously(auth);
            }
        };
        initAuth();

        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'cargas'), orderBy('fecha', 'desc')), (snap) => {
                    historialCargas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderizarApp();
                }, (err) => console.error(err));

                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'estado', 'general'), (snap) => {
                    if (snap.exists()) {
                        estadoAuto = { ...estadoAuto, ...snap.data() };
                        renderizarApp();
                    }
                }, (err) => console.error(err));
            }
        });

        window.toggleConfig = () => {
            const modal = document.getElementById('modal-config');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('conf-nombre').value = estadoAuto.nombreUsuario || "";
                document.getElementById('conf-modelo').value = estadoAuto.modeloAuto || "";
                document.getElementById('conf-matricula').value = estadoAuto.matricula || "";
                document.getElementById('conf-taller').value = estadoAuto.nombreTaller || "";
                document.getElementById('conf-direccion').value = estadoAuto.direccionTaller || "";
                document.getElementById('conf-tel').value = estadoAuto.telefonoTaller || "";
                // Restaurar Precios Electricidad
                document.getElementById('p-empresa').value = estadoAuto.precios?.empresa || 4.76;
                document.getElementById('p-hogar').value = estadoAuto.precios?.hogarValle || 2.32;
                document.getElementById('p-ute-l').value = estadoAuto.precios?.uteLenta || 7.54;
                document.getElementById('p-ute-r').value = estadoAuto.precios?.uteRapida || 10.80;
                document.getElementById('p-wallbox').value = estadoAuto.precios?.wallboxEspecial || 12.00;
                // Restaurar Precios Combustible
                document.getElementById('p-super').value = estadoAuto.combustibles?.["Super 95"] || 88.03;
                document.getElementById('p-premium').value = estadoAuto.combustibles?.["Premium 97"] || 90.09;
                document.getElementById('p-gasoil10').value = estadoAuto.combustibles?.["Gasoil 10S"] || 66.27;
                document.getElementById('p-gasoil50').value = estadoAuto.combustibles?.["Gasoil 50S"] || 57.72;
            }
        };

        window.guardarConfig = async () => {
            if (!user) return;
            const nuevosDatos = {
                nombreUsuario: document.getElementById('conf-nombre').value,
                modeloAuto: document.getElementById('conf-modelo').value,
                matricula: document.getElementById('conf-matricula').value,
                nombreTaller: document.getElementById('conf-taller').value,
                direccionTaller: document.getElementById('conf-direccion').value,
                telefonoTaller: document.getElementById('conf-tel').value,
                precios: {
                    empresa: parseFloat(document.getElementById('p-empresa').value),
                    hogarValle: parseFloat(document.getElementById('p-hogar').value),
                    uteLenta: parseFloat(document.getElementById('p-ute-l').value),
                    uteRapida: parseFloat(document.getElementById('p-ute-r').value),
                    wallboxEspecial: parseFloat(document.getElementById('p-wallbox').value)
                },
                combustibles: {
                    "Super 95": parseFloat(document.getElementById('p-super').value),
                    "Premium 97": parseFloat(document.getElementById('p-premium').value),
                    "Gasoil 10S": parseFloat(document.getElementById('p-gasoil10').value),
                    "Gasoil 50S": parseFloat(document.getElementById('p-gasoil50').value)
                }
            };
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'estado', 'general'), nuevosDatos, { merge: true });
            window.toggleConfig();
        };

        window.cambiarCombustibleComparativo = async (tipo) => {
            if (!user) return;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'estado', 'general'), { combustibleComparativo: tipo }, { merge: true });
        };

        const calcularCostoReal = (kwh, tarifa) => {
            const p = estadoAuto.precios;
            if (tarifa === 'uteRapida') return (kwh * p.uteRapida) + 121.9;
            if (tarifa === 'uteLenta') return (kwh * p.uteLenta) + 40;
            if (tarifa === 'empresa' || tarifa === 'hogarValle') return (kwh * p[tarifa] * 1.22) + (100 * 1.22);
            return (kwh * p.wallboxEspecial * 1.22) + (100 * 1.22);
        };

        window.actualizarPreviewCosto = () => {
            const llegada = parseFloat(document.getElementById('kwh-llegada').value);
            const salida = parseFloat(document.getElementById('kwh-salida').value);
            const tarifaKey = document.getElementById('tipo-tarifa').value;
            const previewEl = document.getElementById('preview-costo');
            
            if (!isNaN(llegada) && !isNaN(salida) && tarifaKey !== "") {
                const kwhCargados = Math.max(0, salida - llegada);
                const costo = calcularCostoReal(kwhCargados, tarifaKey);
                previewEl.innerHTML = `<span class="text-blue-400 font-black">${kwhCargados.toFixed(1)} kWh</span> | <span class="text-green-500 font-black">$${costo.toFixed(0)}</span>`;
                previewEl.className = "text-center text-[11px] font-bold uppercase tracking-widest bg-zinc-900 py-4 rounded-2xl border border-blue-500/30 shadow-inner";
            } else {
                previewEl.innerText = "TELEMETRÍA EN ESPERA";
                previewEl.className = "text-center text-[10px] font-bold text-zinc-700 uppercase tracking-widest bg-zinc-950 py-4 rounded-2xl border border-zinc-900 italic";
            }
        };

        window.agendarWhatsApp = (kms) => {
            const msg = `Soy ${estadoAuto.nombreUsuario} y solicito fecha y hora para realizar el mantenimiento de los ${kms} kms para mi ${estadoAuto.modeloAuto} matrícula ${estadoAuto.matricula}`;
            window.open(`https://wa.me/${estadoAuto.telefonoTaller.replace(/\s+/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
        };

        window.guiarTaller = () => window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(estadoAuto.direccionTaller)}`, '_blank');
        window.abrirMapaCarga = () => window.open("https://www.google.com/maps/search/cargador+auto+electrico+uruguay", "_blank");
        
        // CORREGIDO: URL directa de UTE Mueve
        window.abrirUteMueve = () => window.open("https://mueve.ute.com.uy/", "_blank");
        
        window.eliminarCarga = async (id) => { 
            if (!user) return;
            if (confirm("¿Eliminar este registro?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cargas', id)); 
        };

        document.getElementById('carga-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!user) return;
            const km = parseFloat(document.getElementById('km').value);
            const kwhLlegada = parseFloat(document.getElementById('kwh-llegada').value);
            const kwhSalida = parseFloat(document.getElementById('kwh-salida').value);
            const tarifaKey = document.getElementById('tipo-tarifa').value;
            const esCien = document.getElementById('es-cien').checked;
            if (tarifaKey === "") return alert("Por favor, elija una tarifa de carga");
            const kwhTotales = kwhSalida - kwhLlegada;
            if (kwhTotales <= 0) return alert("kWh Final debe ser mayor a Inicio");
            const costo = calcularCostoReal(kwhTotales, tarifaKey);
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'cargas'), { 
                fecha: Date.now(), km, kwhLlegada, kwhSalida, kwhTotales, esCien, costo, tarifaLabel: tarifaKey 
            });
            e.target.reset();
            actualizarPreviewCosto();
        };

        function renderizarApp() {
            const kmActual = historialCargas[0]?.km || 0;
            const proximoService = Math.ceil((kmActual + 1) / 10000) * 10000;
            const faltan = proximoService - kmActual;
            const progreso = ((10000 - (faltan > 10000 ? 10000 : faltan)) / 10000) * 100;

            let cargasDesdeCien = 0;
            for (let c of historialCargas) { if (c.esCien) break; cargasDesdeCien++; }
            const necesitaBal = cargasDesdeCien >= 4;
            document.getElementById('card-bateria').innerHTML = `
                <div class="bg-zinc-900 border ${necesitaBal ? 'border-purple-500 ring-2 ring-purple-500/20 shadow-purple-900/10' : 'border-zinc-800'} p-6 rounded-[2.5rem] shadow-xl text-center">
                    <p class="text-zinc-500 text-[10px] uppercase font-black tracking-widest mb-2">CUIDA TU BATERIA (BALANCEO LFP)</p>
                    <p class="text-2xl font-black ${necesitaBal ? 'text-purple-400' : 'text-zinc-100'} uppercase">
                        ${necesitaBal ? '¡CARGAR AL 100% HOY!' : 'TOCA CARGA AL 80%'}
                    </p>
                    <p class="text-[10px] text-zinc-600 mt-2 uppercase font-mono font-bold tracking-tight italic">
                        ${necesitaBal ? 'EQUILIBRADO REQUERIDO' : (5 - cargasDesdeCien) + ' CARGAS PARA EL BALANCEO'}
                    </p>
                </div>`;

            let ahorroTotalDinamico = 0;
            if (historialCargas.length > 1) {
                const sorted = [...historialCargas].sort((a,b) => a.km - b.km);
                const precioNaftaRef = estadoAuto.combustibles[estadoAuto.combustibleComparativo] || 88.03;
                for(let i = 1; i < sorted.length; i++) {
                    const dist = sorted[i].km - sorted[i-1].km;
                    const costoEV = sorted[i].costo;
                    if (dist > 0) {
                        const costoNaftaEquiv = (dist / RENDIMIENTO_ANTERIOR_KML) * precioNaftaRef;
                        ahorroTotalDinamico += (costoNaftaEquiv - costoEV);
                    }
                }
            }

            document.getElementById('card-ahorro').innerHTML = `
                <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden text-center">
                    <p class="text-zinc-500 text-[10px] uppercase font-black tracking-widest mb-1">Ahorro Real vs ${estadoAuto.combustibleComparativo}</p>
                    <p class="text-5xl font-black text-green-500 font-mono italic tracking-tighter">$ ${ahorroTotalDinamico.toLocaleString('es-UY', {maximumFractionDigits:0})}</p>
                    <div class="mt-8 grid grid-cols-2 gap-2">
                        ${Object.keys(estadoAuto.combustibles).map(t => `<button onclick="cambiarCombustibleComparativo('${t}')" class="p-2.5 rounded-xl border text-[9px] font-black uppercase transition-all ${estadoAuto.combustibleComparativo === t ? 'bg-green-600 border-green-500 text-white shadow-lg' : 'bg-zinc-800 border-zinc-700 text-zinc-500'}">${t}</button>`).join('')}
                    </div>
                </div>`;

            document.getElementById('card-mantenimiento').innerHTML = `
                <div class="bg-zinc-900 border ${faltan < 500 ? 'border-orange-500 ring-2 ring-orange-500/20' : 'border-zinc-800'} p-6 rounded-[2.5rem] shadow-xl">
                    <p class="text-zinc-500 text-[10px] uppercase font-black tracking-widest mb-1">Mantenimiento Oficial</p>
                    <p class="text-2xl font-black ${faltan < 500 ? 'text-orange-500' : 'text-zinc-100'}">Faltan ${faltan.toLocaleString()} km</p>
                    <div class="mt-4 w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden"><div class="h-full bg-blue-600 transition-all duration-1000" style="width: ${progreso}%"></div></div>
                    ${faltan < 500 ? `<div class="mt-6 pt-4 border-t border-zinc-800 flex gap-2"><button onclick="agendarWhatsApp(${proximoService})" class="flex-1 bg-green-600/10 text-green-500 p-3 rounded-2xl text-[10px] font-black uppercase">WhatsApp</button><button onclick="guiarTaller()" class="flex-1 bg-blue-600/10 text-blue-500 p-3 rounded-2xl text-[10px] font-black uppercase">GPS Taller</button></div>` : ''}
                </div>`;

            const lista = document.getElementById('lista-cargas');
            lista.innerHTML = historialCargas.slice(0, 5).map(c => `
                <div class="bg-zinc-900/40 p-4 rounded-2xl border border-zinc-800/40 mb-2 flex justify-between items-center text-xs backdrop-blur-sm shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="p-2 rounded-lg bg-zinc-800 text-blue-500 border border-zinc-700 font-black text-[8px] uppercase tracking-tighter">${c.tarifaLabel?.substring(0,3) || 'EMP'}</div>
                        <div><span class="font-bold text-zinc-200">${c.km.toLocaleString()} km</span>${c.esCien ? '<span class="ml-1 text-[7px] text-purple-400 font-black uppercase">Full</span>' : ''}<br><span class="text-[9px] text-zinc-600 italic uppercase font-mono">${new Date(c.fecha).toLocaleDateString()}</span></div>
                    </div>
                    <div class="flex items-center gap-4 text-right">
                        <div class="font-mono text-zinc-200"><span class="text-green-500 font-bold">$${c.costo.toFixed(0)}</span><br><span class="text-[9px] text-zinc-700">${c.kwhTotales.toFixed(1)} kWh</span></div>
                        <button onclick="eliminarCarga('${c.id}')" class="text-zinc-800 hover:text-red-500 transition-transform active:scale-90"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>`).join('');
            lucide.createIcons();
        }

        window.onload = () => { lucide.createIcons(); renderizarApp(); };
    </script>
    <style>
        body { background-color: #000; font-family: ui-sans-serif, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="number"] { -moz-appearance: textfield; border-radius: 1rem; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        select { border-radius: 1.5rem; }
    </style>
</head>
<body class="p-6 max-w-md mx-auto min-h-screen pb-24 text-zinc-100 font-sans">
    
    <header class="mb-10 flex flex-col items-center gap-4">
        <div class="relative">
            <img src="logoasys.png" alt="Logo" class="w-28 h-28 object-contain filter drop-shadow-2xl">
            <div class="absolute -inset-2 bg-blue-600/10 blur-2xl rounded-full -z-10"></div>
        </div>
        <div class="flex items-center gap-3">
            <h1 class="text-3xl font-black italic tracking-tighter uppercase leading-none text-white">ASYS<span class="text-blue-500 font-normal">AUTO</span></h1>
            <button onclick="toggleConfig()" class="text-zinc-600 hover:text-blue-500 active:scale-90 transition-all p-1">
                <i data-lucide="settings" class="w-6 h-6"></i>
            </button>
        </div>
        <p class="text-[9px] text-zinc-700 uppercase font-bold tracking-[0.4em] mt-1 font-mono italic text-center">V.24 Restore Plus</p>
    </header>

    <!-- MODAL AJUSTES COMPLETO -->
    <div id="modal-config" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-50 p-8 hidden flex flex-col no-scrollbar overflow-y-auto">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-xl font-black uppercase italic tracking-widest text-blue-500 font-mono">Configuración</h2>
            <button onclick="toggleConfig()" class="text-zinc-500 p-2"><i data-lucide="x"></i></button>
        </div>
        
        <div class="space-y-8 pb-20">
            <!-- Sección Identidad -->
            <div class="space-y-4">
                <p class="text-[9px] font-black text-zinc-600 uppercase tracking-widest border-b border-zinc-900 pb-2 italic">Propietario y Vehículo</p>
                <div class="space-y-2">
                    <label class="text-[8px] text-zinc-500 uppercase ml-2">Nombre</label>
                    <input id="conf-nombre" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-300" placeholder="Nombre">
                </div>
                <div class="space-y-2">
                    <label class="text-[8px] text-zinc-500 uppercase ml-2">Modelo</label>
                    <input id="conf-modelo" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-300" placeholder="Modelo">
                </div>
                <div class="space-y-2">
                    <label class="text-[8px] text-zinc-500 uppercase ml-2">Matrícula</label>
                    <input id="conf-matricula" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-300" placeholder="Matrícula">
                </div>
            </div>

            <!-- Sección Nafta RESTAURADA -->
            <div class="space-y-4">
                <p class="text-[9px] font-black text-blue-500/50 uppercase tracking-widest border-b border-zinc-900 pb-2 italic">Precios Nafta ($/L)</p>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[8px] text-zinc-500 uppercase ml-2">Super 95</label>
                        <input id="p-super" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-100">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[8px] text-zinc-500 uppercase ml-2">Premium 97</label>
                        <input id="p-premium" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-100">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[8px] text-zinc-500 uppercase ml-2">Gasoil 10S</label>
                        <input id="p-gasoil10" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-100">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[8px] text-zinc-500 uppercase ml-2">Gasoil 50S</label>
                        <input id="p-gasoil50" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-100">
                    </div>
                </div>
            </div>

            <!-- Sección Electricidad RESTAURADA -->
            <div class="space-y-4">
                <p class="text-[9px] font-black text-green-500/50 uppercase tracking-widest border-b border-zinc-900 pb-2 italic">Precios Energía ($/kWh)</p>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[8px] text-zinc-500 uppercase ml-2">Empresa</label>
                        <input id="p-empresa" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-100">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[8px] text-zinc-500 uppercase ml-2">Hogar Valle</label>
                        <input id="p-hogar" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-100">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[8px] text-zinc-500 uppercase ml-2">UTE Rápida</label>
                        <input id="p-ute-r" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-100">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[8px] text-zinc-500 uppercase ml-2">UTE Lenta</label>
                        <input id="p-ute-l" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-100">
                    </div>
                    <div class="space-y-1 col-span-2">
                        <label class="text-[8px] text-zinc-500 uppercase ml-2">Wallbox Otros</label>
                        <input id="p-wallbox" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-100">
                    </div>
                </div>
            </div>

            <!-- Sección Taller -->
            <div class="space-y-4">
                <p class="text-[9px] font-black text-zinc-600 uppercase tracking-widest border-b border-zinc-900 pb-2 italic">Taller</p>
                <div class="space-y-2">
                    <label class="text-[8px] text-zinc-500 uppercase ml-2">Nombre Taller</label>
                    <input id="conf-taller" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-300">
                </div>
                <div class="space-y-2">
                    <label class="text-[8px] text-zinc-500 uppercase ml-2">Dirección GPS</label>
                    <input id="conf-direccion" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-300">
                </div>
                <div class="space-y-2">
                    <label class="text-[8px] text-zinc-500 uppercase ml-2">WhatsApp</label>
                    <input id="conf-tel" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-sm outline-none text-zinc-300">
                </div>
            </div>
            
            <button onclick="guardarConfig()" class="w-full bg-blue-600 p-5 rounded-[2rem] font-black tracking-widest text-xs shadow-xl active:scale-95 transition-all uppercase italic">Guardar Configuración</button>
        </div>
    </div>

    <!-- CARDS DASHBOARD -->
    <div id="card-bateria" class="mb-4"></div>
    
    <div class="mb-8 grid grid-cols-2 gap-4 px-1">
        <button onclick="abrirMapaCarga()" class="bg-zinc-900 border border-zinc-800 p-5 rounded-[2.5rem] flex flex-col items-center gap-2 active:scale-95 shadow-xl transition-transform">
            <div class="p-2 bg-red-500/10 rounded-xl text-red-500 shadow-inner"><i data-lucide="map-pin"></i></div>
            <p class="text-[9px] font-black uppercase text-zinc-500 tracking-tighter">Cargadores</p>
        </button>
        <button onclick="abrirUteMueve()" class="bg-zinc-900 border border-zinc-800 p-5 rounded-[2.5rem] flex flex-col items-center gap-2 active:scale-95 shadow-xl transition-transform">
            <div class="p-2 bg-blue-500/10 rounded-xl text-blue-500 shadow-inner"><i data-lucide="zap"></i></div>
            <p class="text-[9px] font-black uppercase text-zinc-500 tracking-tighter uppercase">Red UTE</p>
        </button>
    </div>

    <!-- FORMULARIO DE REGISTRO -->
    <section class="bg-zinc-900/60 p-8 rounded-[3.5rem] border border-zinc-800/40 shadow-2xl mb-8 relative">
        <form id="carga-form" class="space-y-6">
            <div class="space-y-5 text-center">
                <div class="space-y-1">
                    <label class="text-[9px] text-zinc-600 font-bold uppercase tracking-widest font-mono">Kilómetros al cargar</label>
                    <input type="number" id="km" required class="w-full bg-black border border-zinc-800 p-5 text-center font-black text-2xl outline-none focus:border-blue-600 transition-all shadow-inner" placeholder="0">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[9px] text-orange-400 font-bold uppercase tracking-widest font-mono text-center block uppercase">kWh Inicio</label>
                        <input type="number" step="0.1" id="kwh-llegada" oninput="actualizarPreviewCosto()" required class="w-full bg-black border border-zinc-800 p-4 text-center font-black text-xl outline-none focus:border-blue-500" placeholder="0.0">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] text-green-400 font-bold uppercase tracking-widest font-mono text-center block uppercase">kWh Final</label>
                        <input type="number" step="0.1" id="kwh-salida" oninput="actualizarPreviewCosto()" required class="w-full bg-black border border-zinc-800 p-4 text-center font-black text-xl outline-none focus:border-blue-500" placeholder="0.0">
                    </div>
                </div>

                <div class="space-y-1 pt-2">
                    <select id="tipo-tarifa" onchange="actualizarPreviewCosto()" class="w-full bg-zinc-950 border border-zinc-800 p-5 rounded-[1.5rem] text-sm outline-none text-zinc-400 font-black appearance-none text-center shadow-lg active:border-blue-600 transition-all cursor-pointer">
                        <option value="" disabled selected>ELIJA SU TARIFA DE CARGA</option>
                        <option value="uteLenta">Cargador UTE (Lento)</option>
                        <option value="uteRapida">Cargador UTE (Rapido)</option>
                        <option value="empresa">CUTCSA (Solo autorizados)</option>
                        <option value="hogarValle">Hogar (Tarifa Valle)</option>
                        <option value="wallboxEspecial">Wallbox (ingresar tarifa si difiere)</option>
                    </select>
                </div>
            </div>

            <div id="preview-costo" class="text-center text-[10px] font-bold text-zinc-700 uppercase tracking-widest bg-zinc-950 py-4 rounded-2xl border border-zinc-900 italic">TELEMETRÍA EN ESPERA</div>

            <label class="flex items-center justify-between p-5 bg-black/40 border border-zinc-800/40 rounded-2xl cursor-pointer">
                <div class="flex flex-col text-left">
                    <span class="text-xs font-bold text-zinc-300 uppercase italic">Carga al 100%</span>
                    <span class="text-[8px] text-zinc-600 uppercase font-mono tracking-widest">Balanceo LFP</span>
                </div>
                <input type="checkbox" id="es-cien" class="w-6 h-6 rounded-lg accent-purple-500">
            </label>

            <button type="submit" class="w-full bg-blue-600 p-5 rounded-[2.5rem] font-black tracking-widest text-sm shadow-xl active:scale-95 transition-all">REGISTRAR CARGA</button>
        </form>
    </section>

    <div id="card-ahorro" class="mb-4"></div>
    <div id="card-mantenimiento" class="mb-12"></div>

    <div class="flex justify-between items-center px-4 mb-4">
        <h3 class="text-[10px] font-black text-zinc-800 uppercase tracking-widest flex items-center gap-2"><span class="w-6 h-[1px] bg-zinc-900"></span> Bitácora</h3>
        <button onclick="exportarReporte()" class="text-blue-500 text-[10px] font-black uppercase flex items-center gap-1 bg-blue-500/10 px-3 py-1.5 rounded-full"><i data-lucide="file-text" class="w-3"></i> PDF</button>
    </div>
    <div id="lista-cargas" class="pb-10"></div>

</body>
</html>
