<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aion MAX - Bitácora Familiar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURACIÓN DE JUAN CARLOS
        const firebaseConfig = {
            apiKey: "AIzaSyBlrsjN8s3iN0NRiuemEowIIwVqtkkWlOo",
            authDomain: "control-carga-aion-ut.firebaseapp.com",
            projectId: "control-carga-aion-ut",
            storageBucket: "control-carga-aion-ut.firebasestorage.app",
            messagingSenderId: "77118717320",
            appId: "1:77118717320:web:93ee651259cc7866438e3d"
        };

        const PRECIO_KWH_BASE = 4.76;
        const PRECIO_CONEXION_BASE = 100;
        const IVA = 1.22;
        const PRECIO_NAFTA_L = 82.27;
        const RENDIMIENTO_VERSA_KML = 12;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "control-carga-aion-ut";

        let user = null;
        let historialCargas = [];
        let estadoAuto = { ultimoLavado: Date.now(), por: "Juan" };
        let conductorSeleccionado = "Juan";

        // SELECTOR DE CONDUCTOR
        const setupDriverSelector = () => {
            const chips = document.querySelectorAll('.driver-chip');
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    chips.forEach(c => c.classList.remove('bg-blue-600', 'text-white', 'border-blue-500'));
                    chips.forEach(c => c.classList.add('bg-zinc-800', 'text-zinc-400', 'border-zinc-700'));
                    chip.classList.remove('bg-zinc-800', 'text-zinc-400', 'border-zinc-700');
                    chip.classList.add('bg-blue-600', 'text-white', 'border-blue-500');
                    conductorSeleccionado = chip.dataset.name;
                });
            });
        };

        // FIREBASE SYNC
        const initApp = async () => {
            try {
                await signInAnonymously(auth);
            } catch (err) { console.error("Error Auth:", err); }

            onAuthStateChanged(auth, (u) => {
                if (u) {
                    user = u;
                    // Escuchar Cargas
                    const cargasRef = collection(db, 'artifacts', appId, 'public', 'data', 'cargas');
                    onSnapshot(cargasRef, (snap) => {
                        historialCargas = snap.docs.map(d => d.data())
                            .sort((a, b) => b.fecha - a.fecha);
                        renderizarApp();
                    });
                    // Escuchar Lavado
                    const estadoRef = doc(db, 'artifacts', appId, 'public', 'data', 'estado', 'general');
                    onSnapshot(estadoRef, (snap) => {
                        if (snap.exists()) {
                            estadoAuto = snap.data();
                            renderizarApp();
                        }
                    });
                }
            });
        };

        // REGISTRAR LAVADO (MANUAL CON CALENDARIO)
        window.guardarLavadoManual = async () => {
            const fechaInput = document.getElementById('fecha-lavado').value;
            if (!fechaInput) return alert("Selecciona un día en el calendario");
            
            const [year, month, day] = fechaInput.split('-');
            const timestamp = new Date(year, month - 1, day, 12, 0, 0).getTime();

            try {
                const estadoRef = doc(db, 'artifacts', appId, 'public', 'data', 'estado', 'general');
                await setDoc(estadoRef, { 
                    ultimoLavado: timestamp, 
                    por: conductorSeleccionado 
                });
                alert("Lavado registrado con éxito");
            } catch (e) { console.error(e); }
        };

        // GUARDAR CARGA
        document.getElementById('carga-form').onsubmit = async (e) => {
            e.preventDefault();
            const km = parseFloat(document.getElementById('km').value);
            const kwh = parseFloat(document.getElementById('kwh').value);
            const esCien = document.getElementById('es-cien').checked;
            
            const costo = (kwh * PRECIO_KWH_BASE * IVA) + (PRECIO_CONEXION_BASE * IVA);
            let ahorro = 0;

            if (historialCargas.length > 0) {
                const dist = km - historialCargas[0].km;
                if (dist > 0) {
                    const costoNaftaEquiv = (dist / RENDIMIENTO_VERSA_KML) * PRECIO_NAFTA_L;
                    ahorro = costoNaftaEquiv - costo;
                }
            }

            try {
                const cargasRef = collection(db, 'artifacts', appId, 'public', 'data', 'cargas');
                await addDoc(cargasRef, {
                    fecha: Date.now(), km, kwh, conductor: conductorSeleccionado, esCien, costo, ahorro
                });
                e.target.reset();
            } catch (e) { console.error(e); }
        };

        function renderizarApp() {
            const kmActual = historialCargas[0]?.km || 0;
            
            // --- LÓGICA DE MANTENIMIENTO ---
            const proximoService = Math.ceil((kmActual + 1) / 10000) * 10000;
            const faltan = proximoService - kmActual;
            const alertaService = document.getElementById('alerta-mantenimiento');
            
            if (faltan <= 500 && kmActual > 0) {
                alertaService.classList.remove('hidden');
                alertaService.innerHTML = `
                    <div class="bg-orange-600 text-white p-4 rounded-2xl flex items-center gap-4 mb-6 shadow-lg shadow-orange-900/40">
                        <i data-lucide="wrench" class="w-8 h-8"></i>
                        <div>
                            <p class="font-black text-sm uppercase">¡Aviso de Mantenimiento!</p>
                            <p class="text-xs opacity-90">Faltan ${faltan} km para los ${proximoService.toLocaleString()} km oficiales.</p>
                        </div>
                    </div>`;
            } else { alertaService.classList.add('hidden'); }

            // MONITOR DE KM
            const progreso = ((10000 - (faltan > 10000 ? 10000 : faltan)) / 10000) * 100;
            document.getElementById('monitor-km').innerHTML = `
                <div class="flex justify-between items-end mb-2">
                    <p class="text-[10px] text-zinc-500 uppercase font-bold tracking-widest font-mono">Service Progress</p>
                    <p class="text-[10px] font-bold text-blue-500 font-mono">${kmActual.toLocaleString()} / ${proximoService.toLocaleString()} KM</p>
                </div>
                <div class="w-full bg-zinc-800 h-1 rounded-full overflow-hidden">
                    <div class="h-full bg-blue-600 transition-all duration-1000" style="width: ${progreso}%"></div>
                </div>`;

            // CARD LAVADO (REDISEÑO SEGÚN PEDIDO)
            const hoy = new Date().setHours(0,0,0,0);
            const dLavado = new Date(estadoAuto.ultimoLavado).setHours(0,0,0,0);
            const dias = Math.floor(Math.abs(hoy - dLavado) / (1000 * 60 * 60 * 24));

            document.getElementById('card-lavado').innerHTML = `
                <div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-xl mb-6">
                    <div class="flex items-start gap-4 mb-5">
                        <div class="bg-blue-500/10 p-3 rounded-2xl text-blue-500">
                            <i data-lucide="droplets"></i>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-zinc-100">
                                El último lavado fue hace <span class="${dias > 7 ? 'text-orange-500' : 'text-blue-500'}">${dias} días</span>.
                            </p>
                            <p class="text-[9px] text-zinc-600 uppercase mt-1 font-mono">Por: ${estadoAuto.por}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <input type="date" id="fecha-lavado" class="flex-grow bg-black border border-zinc-800 text-zinc-400 p-3 rounded-xl text-sm outline-none focus:border-blue-500">
                        <button onclick="guardarLavadoManual()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 rounded-xl transition-all shadow-lg active:scale-95">
                            <i data-lucide="calendar-plus"></i>
                        </button>
                    </div>
                </div>`;

            // AHORRO
            const ahorroTotal = historialCargas.reduce((acc, curr) => acc + (curr.ahorro || 0), 0);
            document.getElementById('stats-ahorro').innerHTML = `
                <div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-800 shadow-xl flex items-center justify-between mb-8">
                    <div>
                        <p class="text-zinc-500 text-[10px] uppercase font-bold tracking-widest mb-1 font-mono">Ahorro vs Versa</p>
                        <p class="text-3xl font-black text-green-500">$ ${ahorroTotal.toLocaleString('es-UY', {maximumFractionDigits:0})}</p>
                    </div>
                    <div class="bg-green-500/10 p-3 rounded-2xl text-green-500">
                        <i data-lucide="trending-up" class="w-8 h-8"></i>
                    </div>
                </div>`;

            // HISTORIAL
            const lista = document.getElementById('lista-cargas');
            if (historialCargas.length === 0) {
                lista.innerHTML = '<p class="text-center text-zinc-700 py-10 text-xs italic">Ingresá el kilometraje actual para activar.</p>';
            } else {
                lista.innerHTML = historialCargas.slice(0, 3).map(c => `
                <div class="bg-zinc-900/50 p-4 rounded-2xl border border-zinc-800/40 mb-3 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-[10px] font-bold text-blue-500 border border-zinc-700">${c.conductor.charAt(0)}</div>
                        <div><p class="text-sm font-bold text-zinc-200">${c.km.toLocaleString()} km</p><p class="text-[9px] text-zinc-600 font-mono">${new Date(c.fecha).toLocaleDateString()}</p></div>
                    </div>
                    <div class="text-right"><p class="text-xs font-bold text-green-600">$${c.costo.toFixed(0)}</p><p class="text-[9px] text-zinc-700 font-mono">${c.kwh} kWh</p></div>
                </div>`).join('');
            }
            lucide.createIcons();
        }

        window.onload = () => {
            setupDriverSelector();
            initApp();
            lucide.createIcons();
        };
    </script>
    <style>
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        body { background-color: #000; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="p-5 max-w-md mx-auto min-h-screen pb-16">
    
    <header class="mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black italic tracking-tighter uppercase leading-none text-white">AION<span class="text-blue-500 font-medium">MAX</span></h1>
            <p class="text-[10px] text-zinc-600 uppercase font-bold tracking-[0.3em] mt-2 font-mono">Control de Gestión</p>
        </div>
        <div class="bg-zinc-900/50 p-3 rounded-2xl border border-zinc-800/50 text-blue-500 shadow-lg">
            <i data-lucide="zap"></i>
        </div>
    </header>

    <div id="alerta-mantenimiento" class="hidden"></div>
    <div id="monitor-km" class="mb-8 px-1"></div>

    <div id="card-lavado"></div>
    <div id="stats-ahorro"></div>

    <section class="bg-zinc-900/40 p-8 rounded-[3rem] border border-zinc-800/40 shadow-2xl mb-12 relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-600/5 blur-3xl"></div>
        <h2 class="text-[10px] font-black text-zinc-500 uppercase tracking-[0.3em] mb-8 text-center font-mono">Registrar Nueva Carga</h2>
        <form id="carga-form" class="space-y-8">
            <div class="grid grid-cols-3 gap-2">
                <div data-name="Juan" class="driver-chip p-3 rounded-2xl border border-blue-500 text-center font-bold text-xs bg-blue-600 text-white cursor-pointer shadow-lg shadow-blue-900/20 transition-all">Juan</div>
                <div data-name="Tania" class="driver-chip p-3 rounded-2xl border border-zinc-700 text-center font-bold text-xs bg-zinc-800 text-zinc-400 cursor-pointer transition-all">Tania</div>
                <div data-name="Mauri" class="driver-chip p-3 rounded-2xl border border-zinc-700 text-center font-bold text-xs bg-zinc-800 text-zinc-400 cursor-pointer transition-all">Mauri</div>
            </div>

            <div class="grid grid-cols-2 gap-5">
                <div class="space-y-2">
                    <label class="text-[10px] text-zinc-600 font-bold uppercase ml-2 font-mono">Km Actual</label>
                    <input type="number" id="km" required class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-center font-black text-2xl focus:border-blue-600 outline-none transition-all shadow-inner" placeholder="0">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] text-zinc-600 font-bold uppercase ml-2 font-mono">kWh Totales</label>
                    <input type="number" step="0.1" id="kwh" required class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-center font-black text-2xl focus:border-blue-600 outline-none transition-all shadow-inner" placeholder="0.0">
                </div>
            </div>

            <label class="flex items-center justify-between p-5 bg-black/50 border border-zinc-800/40 rounded-2xl cursor-pointer hover:bg-black transition-colors shadow-inner">
                <span class="text-xs font-bold text-zinc-400">¿Carga completa (100%)?</span>
                <input type="checkbox" id="es-cien" class="w-6 h-6 rounded-lg accent-blue-600">
            </label>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 p-5 rounded-[2.5rem] font-black tracking-[0.2em] text-sm shadow-xl shadow-blue-900/40 active:scale-95 transition-all">
                GUARDAR REGISTRO
            </button>
        </form>
    </section>

    <div class="px-2">
        <h3 class="text-[10px] font-black text-zinc-700 uppercase mb-6 tracking-[0.3em] flex items-center gap-3">
            <span class="w-8 h-[1px] bg-zinc-900"></span> Últimos Movimientos
        </h3>
        <div id="lista-cargas"></div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
